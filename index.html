        ["Правила подъема.", "Вертикально. Наклон стропа не более 45° от вертикали."],
        ["Данные на кране.", "Рег. номер, Q (грузоподъемность), даты ПТО/ЧТО."],
        ["Руководство ИТР.", "Сложные подъемы, негабаритные грузы."],
        ["Наряд-допуск.", "Для работ вблизи ЛЭП (ближе 30м) и в охранных зонах коммункаций."]
    ]}
];

const container = document.getElementById('tickets-container');

function renderTickets(filter = '') {
    container.innerHTML = '';
    const filtered = data.filter(t => {
        const fullText = JSON.stringify(t).toLowerCase();
        return fullText.includes(filter.toLowerCase());
    });

    filtered.forEach(t => {
        const ticketDiv = document.createElement('div');
        ticketDiv.className = 'ticket';
        
        let html = `<span class="ticket-title">Билет №${t.n}</span>`;
        t.qs.forEach((q, idx) => {
            html += `
                <div class="q-item">
                    <span class="question">${idx + 1}. ${q[0]}</span>
                    <div class="answer">${q[1]}</div>
                </div>
            `;
        });
        
        ticketDiv.innerHTML = html;
        container.appendChild(ticketDiv);
    });
}

document.getElementById('search').addEventListener('input', (e) => {
    renderTickets(e.target.value);
});

// Инициализация
renderTickets();
</script>
